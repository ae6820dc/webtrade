<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webtrade – Fájlindex</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:#f3f4f6;font:16px Arial,sans-serif}.wrap{max-width:960px;margin:auto;padding:28px 18px}h1{margin:0 0 12px}.path{color:#9ca3af;margin:12px 0}button,a.item{border:0;border-radius:10px;padding:13px 15px;font-size:16px}button{background:#374151;color:white;cursor:pointer;margin:0 8px 18px 0}.list{display:grid;gap:9px}.item{display:block;background:#1f2937;color:#f3f4f6;text-decoration:none}.item:hover{background:#374151}</style></head><body><main class="wrap"><h1>📦 Webtrade</h1><div id="path" class="path">/</div><button onclick="home()">🏠 Főkönyvtár</button><button onclick="back()">⬅️ Vissza</button><div id="list" class="list"></div></main><script>const tree=[{"name":"readme.html","type":"file"}];let current=[];function items(){let a=tree;for(const n of current)a=a.find(x=>x.name===n).children;return a}function render(){document.getElementById("path").textContent="/"+current.join("/");const list=document.getElementById("list");list.replaceChildren();for(const item of items()){const a=document.createElement("a");a.className="item";a.textContent=(item.type==="dir"?"📁 ":"📄 ")+item.name;if(item.type==="dir"){a.href="#";a.onclick=e=>{e.preventDefault();current.push(item.name);render()}}else{a.href=[...current,item.name].map(encodeURIComponent).join("/");a.target="_blank"}list.append(a)}}function home(){current=[];render()}function back(){current.pop();render()}render();</script></body></html>
